name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  INSTA_UPDATE: "no"

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and the components.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Findings lint
        run: scripts/lint-findings
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: cargo-deny
        run: |
          brew install cargo-deny
          cargo deny check
