[package]
name = "lithemux-core"
description = "Model, storage, context and launcher for lithemux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
directories.workspace = true
rusqlite.workspace = true
rustix.workspace = true
signal-hook.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
insta.workspace = true
proc-macro2.workspace = true
syn.workspace = true
tempfile.workspace = true

# The workspace forbids `unsafe`; this crate denies it instead, so that the
# single documented exception in platform/process/detached.rs can be allowed
# where it is (docs/decisiones.md D-27). Keep the rest equal to the workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
