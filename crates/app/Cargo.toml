[package]
name = "lithemux-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native lithemux window (gpui spike)"
publish = false

[lib]
name = "lithemux_app"
path = "src/lib.rs"

[[bin]]
name = "lithemux-app"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
lithemux-core.workspace = true
alacritty_terminal.workspace = true
anyhow.workspace = true
async-channel.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
portable-pty.workspace = true
rustix.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
toml.workspace = true

# PLAN §3.7: the embedded browser spike. Off by default, never in a release
# build; `cargo run -p lithemux-app --features webview-spike` turns it on.
[features]
webview-spike = ["dep:lithemux-webview-spike"]

[target.'cfg(target_os = "macos")'.dependencies]
lithemux-webview-spike = { workspace = true, optional = true }

[dev-dependencies]
async-channel.workspace = true
lithemux-core.workspace = true
rustix.workspace = true
tempfile.workspace = true

[lints]
workspace = true
