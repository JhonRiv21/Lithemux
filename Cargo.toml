[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/hook"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/JhonRiv21/lithemux"

[workspace.dependencies]
lithemux-core = { path = "crates/core", version = "0.1.0" }
anyhow = "1"
assert_cmd = "2"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
insta = "1.49"
rusqlite = { version = "0.43", features = ["bundled"] }
rustix = { version = "1.1", features = ["process"] }
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package.insta]
opt-level = 3
