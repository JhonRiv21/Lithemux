[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/hook", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/JhonRiv21/lithemux"

[workspace.dependencies]
lithemux-core = { path = "crates/core", version = "0.1.0" }
alacritty_terminal = "0.26"
anyhow = "1"
assert_cmd = "2"
async-channel = "2"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
gpui = { git = "https://github.com/zed-industries/zed", rev = "d01b134cddf5e4f71964deb2d6f81cdb38fcf1e7", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d01b134cddf5e4f71964deb2d6f81cdb38fcf1e7", default-features = false, features = ["font-kit", "runtime_shaders"] }
insta = "1.49"
portable-pty = "0.9"
proc-macro2 = { version = "1", features = ["span-locations"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustix = { version = "1.1", features = ["net", "process"] }
syn = { version = "2", features = ["full", "visit"] }
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package.insta]
opt-level = 3
