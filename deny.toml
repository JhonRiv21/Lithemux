# Zero telemetry and zero network (PLAN principle 2). cargo-deny has no
# wildcards, so known crates are listed here and the prefixes (sentry*,
# posthog*, ...) are enforced by crates/core/tests/single_source_guards.rs.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Telemetry, analytics and error reporting.
    { crate = "sentry" },
    { crate = "sentry-core" },
    { crate = "sentry-types" },
    { crate = "sentry-backtrace" },
    { crate = "sentry-contexts" },
    { crate = "sentry-panic" },
    { crate = "sentry-tracing" },
    { crate = "sentry-anyhow" },
    { crate = "sentry-log" },
    { crate = "sentry-tower" },
    { crate = "sentry-debug-images" },
    { crate = "posthog-rs" },
    { crate = "posthog" },
    { crate = "opentelemetry" },
    { crate = "opentelemetry_sdk" },
    { crate = "opentelemetry-otlp" },
    { crate = "opentelemetry-http" },
    { crate = "opentelemetry-proto" },
    { crate = "opentelemetry-stdout" },
    { crate = "opentelemetry-semantic-conventions" },
    { crate = "tracing-opentelemetry" },
    { crate = "segment" },
    { crate = "rudderanalytics" },
    { crate = "mixpanel-rs" },
    { crate = "amplitude" },
    { crate = "bugsnag" },
    { crate = "datadog-apm" },
    { crate = "dogstatsd" },
    # HTTP clients: core, cli and hook never talk to the network.
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "ureq" },
    { crate = "isahc" },
    { crate = "surf" },
    { crate = "curl" },
    { crate = "attohttpc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
