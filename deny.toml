# Zero telemetry and zero network (PLAN principle 2). cargo-deny has no
# wildcards, so known crates are listed here and the prefixes (sentry*,
# posthog*, ...) are enforced by crates/core/tests/single_source_guards.rs.

[graph]
all-features = true
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
version = 2
# Unmaintained crates that gpui pulls in at the pinned rev; none has a
# vulnerability advisory. See docs/decisiones.md D-15. Review each one when the
# gpui rev changes, and no later than the date in its reason.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: font parsing inside gpui, no replacement at this rev; review by 2027-02-21" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: text shaping via resvg/usvg inside gpui; review by 2027-02-21" },
    { id = "RUSTSEC-2026-0543", reason = "chrono: gpui dependency, no network or parsing of untrusted input; review by 2027-02-21" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Telemetry, analytics and error reporting.
    { crate = "sentry" },
    { crate = "sentry-core" },
    { crate = "sentry-types" },
    { crate = "sentry-backtrace" },
    { crate = "sentry-contexts" },
    { crate = "sentry-panic" },
    { crate = "sentry-tracing" },
    { crate = "sentry-anyhow" },
    { crate = "sentry-log" },
    { crate = "sentry-tower" },
    { crate = "sentry-debug-images" },
    { crate = "posthog-rs" },
    { crate = "posthog" },
    { crate = "opentelemetry" },
    { crate = "opentelemetry_sdk" },
    { crate = "opentelemetry-otlp" },
    { crate = "opentelemetry-http" },
    { crate = "opentelemetry-proto" },
    { crate = "opentelemetry-stdout" },
    { crate = "opentelemetry-semantic-conventions" },
    { crate = "tracing-opentelemetry" },
    { crate = "segment" },
    { crate = "rudderanalytics" },
    { crate = "mixpanel-rs" },
    { crate = "amplitude" },
    { crate = "bugsnag" },
    { crate = "datadog-apm" },
    { crate = "dogstatsd" },
    # HTTP clients: core, cli and hook never talk to the network.
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "ureq" },
    { crate = "isahc" },
    { crate = "surf" },
    { crate = "curl" },
    { crate = "attohttpc" },
    { crate = "tungstenite" },
    # TLS: nothing here opens a connection, so nothing needs it.
    { crate = "rustls" },
    { crate = "native-tls" },
    # Zed's own telemetry and network crates, one `git` dependency away.
    { crate = "telemetry" },
    { crate = "telemetry_events" },
    { crate = "reqwest_client" },
    { crate = "client" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# gpui is not usable from crates.io; pinned by rev in Cargo.toml (D-14).
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/zed-industries/font-kit",
]
